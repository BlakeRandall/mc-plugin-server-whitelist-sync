name: WhitelistSync
version: "${version}"
main: dev.example.whitelistsync.WhitelistSyncPlugin
api-version: '26.1'
description: Synchronizes Paper whitelists through a shared MongoDB database.
author: WhitelistSync
commands:
  whitelistsync:
    description: Manage WhitelistSync
    usage: /whitelistsync <sync|status|reload>
    permission: whitelistsync.admin
permissions:
  whitelistsync.admin:
    description: Allows administration of WhitelistSync.
    default: op
